plugins {
	id 'java'
}

import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.gpsbookmark.GpsBookmarkPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.gpsbookmark'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

// LWJGL publishes native JARs for every OS/architecture combination.
// Without platform constraints Gradle tries to resolve all of them, causing
// "Could not find ... natives-linux-arm64.jar" errors on Windows (or vice versa).
// Restrict testRuntimeClasspath to only the natives that match the current machine.
configurations.testRuntimeClasspath {
	def os = DefaultNativePlatform.currentOperatingSystem
	def arch = DefaultNativePlatform.currentArchitecture
	attributes {
		attribute(
			OperatingSystemFamily.OPERATING_SYSTEM_ATTRIBUTE,
			objects.named(OperatingSystemFamily,
				os.isWindows() ? OperatingSystemFamily.WINDOWS
				: os.isMacOsX() ? OperatingSystemFamily.MACOS
				: OperatingSystemFamily.LINUX))
		attribute(
			MachineArchitecture.ARCHITECTURE_ATTRIBUTE,
			objects.named(MachineArchitecture,
				arch.isAmd64() ? MachineArchitecture.X86_64
				: MachineArchitecture.ARM64))
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
