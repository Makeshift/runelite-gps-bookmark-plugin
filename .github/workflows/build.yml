name: Build

on:
  push:
    branches: ['**']
  # pull_request:
  #   branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar and shadowJar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: always
          cache-provider: basic
          dependency-graph: ${{ github.ref_name == github.event.repository.default_branch && 'generate-submit-and-upload' || 'generate' }}
          dependency-graph-continue-on-failure: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache OSRS POI cache
        uses: actions/cache@v4
        with:
          path: .poi-cache
          # Bust the cache when poi-configs change so we re-download against
          # the latest openrs2 snapshot if a new POI category is added.
          key: poi-cache-${{ runner.os }}-${{ hashFiles('poi-configs/**') }}
          restore-keys: |
            poi-cache-${{ runner.os }}-

      - name: Download OSRS POI cache
        run: ./gradlew --no-daemon downloadPoiCache

      - name: Build jar and shadowJar
        run: ./gradlew --no-daemon jar shadowJar

      - name: Upload Shaded Jar
        uses: actions/upload-artifact@v7
        with:
          # Contains the whole Runelite client with the plugin included
          name: gps-bookmark-plugin-shadowed-with-runelite
          path: |
            build/libs/*-all.jar
          if-no-files-found: error
          archive: false
          
      - name: Upload Plugin Jar
        uses: actions/upload-artifact@v7
        with:
          # Only the plugin
          name: gps-bookmark-plugin-only
          path: |
            build/libs/*-plugin.jar
          if-no-files-found: error
          archive: false
