name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build jar and shadowJar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build jar and shadowJar
        run: ./gradlew --no-daemon jar shadowJar

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gps-bookmark-plugin-jars
          path: |
            build/libs/*.jar
          if-no-files-found: error
