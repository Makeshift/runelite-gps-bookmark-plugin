// Runs com.gpsbookmark.dumper.PoiDumper at build time over every JSON
// config in poi-configs/, embedding the resulting JSON files in the
// plugin jar via processResources. Override the cache revision with
// -PpoiCacheId=<openrs2 cache id>; skip the dump entirely with
// -PskipPoiDump=true.

def poiCacheRoot    = layout.projectDirectory.dir('.poi-cache')
def poiConfigsDir   = layout.projectDirectory.dir('poi-configs')
def poiGeneratedDir = layout.buildDirectory.dir('generated-resources/poi')
def poiSkip         = providers.gradleProperty('skipPoiDump').orElse('false').map { it.toBoolean() }
def poiCacheIdProp  = providers.gradleProperty('poiCacheId').orElse('')

// Separate sourceSet keeps the dumper (and net.runelite:cache) out of
// the runtime plugin jar.
sourceSets {
    dumper {
        java {
            srcDirs = ['src/dumper/java']
        }
    }
}

dependencies {
    dumperImplementation(group: 'net.runelite', name: 'cache', version: 'latest.release') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    dumperImplementation 'com.google.code.gson:gson:2.10.1'
    dumperRuntimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}

tasks.register('dumpPois', JavaExec) {
    group = 'poi'
    description = 'Runs the POI cache dumper for every config in poi-configs/.'

    classpath = sourceSets.dumper.runtimeClasspath
    mainClass = 'com.gpsbookmark.dumper.PoiDumper'
    jvmArgs '-Xms512m', '-Xmx2g'

    inputs.dir(poiConfigsDir).withPropertyName('poiConfigs').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(sourceSets.dumper.output).withPropertyName('dumperClasses')
    inputs.property 'skipPoiDump', poiSkip
    inputs.property 'poiCacheId', poiCacheIdProp
    outputs.dir(poiGeneratedDir).withPropertyName('poiGenerated')

    // Wipe stale outputs (e.g. if a config was removed) before regenerating.
    doFirst {
        def out = poiGeneratedDir.get().asFile
        if (out.isDirectory()) {
            project.delete(out)
        }
        out.mkdirs()
    }

    argumentProviders.add({
        def args = [
            '--config-dir', poiConfigsDir.asFile.absolutePath,
            '--cache-root', poiCacheRoot.asFile.absolutePath,
            '--output-dir', poiGeneratedDir.get().asFile.absolutePath,
        ]
        if (poiSkip.get()) {
            args << '--skip'
        }
        def id = poiCacheIdProp.get()
        if (id != null && !id.isEmpty()) {
            args.addAll(['--openrs2-cache-id', id])
        }
        args
    } as CommandLineArgumentProvider)
}

// Embed the generated JSON into the plugin jar.
sourceSets.main.resources.srcDir(poiGeneratedDir)
processResources.dependsOn 'dumpPois'

// Opt-in: cross-check our JSON dump against the TSV produced by upstream
// shortest-path-tooling's bankTileDump task. Run their task first to
// produce bank_tile_placements.tsv against the same cache revision, then:
//   ./gradlew comparePoiDumpToUpstream -PupstreamTsv=/abs/path/to/bank_tile_placements.tsv
// Optionally override which JSON to compare via -PourJson=<path>.
def upstreamTsvProp = providers.gradleProperty('upstreamTsv').orElse('')
def ourJsonProp     = providers.gradleProperty('ourJson').orElse('')

tasks.register('comparePoiDumpToUpstream', Test) {
    group = 'verification'
    description = 'Cross-checks our POI JSON dump against the TSV from ' +
        'osrs-pathfinding/shortest-path-tooling. Requires -PupstreamTsv=<path>.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnit()
    include '**/PoiDumpUpstreamComparisonTest.class'

    // Run on every invocation; the underlying assertions depend on
    // user-supplied input that Gradle can't fingerprint.
    outputs.upToDateWhen { false }

    systemProperty 'comparePoiDump', 'true'
    testLogging {
        showStandardStreams = true
        exceptionFormat 'full'
    }

    doFirst {
        def tsv = upstreamTsvProp.get()
        if (tsv.isEmpty()) {
            throw new GradleException(
                "comparePoiDumpToUpstream requires -PupstreamTsv=<path-to-upstream-tsv>. " +
                "Generate it with osrs-pathfinding/shortest-path-tooling's `bankTileDump` task " +
                "against the same cache revision used by ./gradlew dumpPois.")
        }
        systemProperty 'comparePoiDump.upstreamTsv', tsv
        def ours = ourJsonProp.get()
        if (!ours.isEmpty()) {
            systemProperty 'comparePoiDump.ourJson', ours
        }
    }
}
